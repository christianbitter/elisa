[project]
name = "elisa"
version = "0.1.1"
description = "A small Pygame-centered library to build Python games."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The engine package sits at the repository root, beside asset/ and the
# tutorial scripts; only elisa/ belongs in the distribution.
module-name = "elisa"
module-root = ""
